plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.ilooner'
version = providers.gradleProperty('releaseVersion').getOrElse('0.1.0-SNAPSHOT')
if (!(version ==~ /[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?/)) {
    throw new GradleException('releaseVersion must have the form 1.2.3 or 1.2.3-rc.1')
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

def generateVersion = tasks.register('generateVersion') {
    def sdkVersion = project.version.toString()
    def outputDirectory = layout.buildDirectory.dir('generated/sources/version')
    inputs.property 'sdkVersion', sdkVersion
    outputs.dir outputDirectory
    doLast {
        def source = outputDirectory.get().file('com/onepassword/sdk/internal/BuildInfo.java').asFile
        source.parentFile.mkdirs()
        source.text = """package com.onepassword.sdk.internal;

/** SDK version generated by Gradle. */
public final class BuildInfo {
    public static final String VERSION = "${sdkVersion}";
    private BuildInfo() {}
}
"""
    }
}
sourceSets.main.java.srcDir(generateVersion)

dependencies {
    api 'com.fasterxml.jackson.core:jackson-annotations:2.19.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.19.0'
    implementation 'net.java.dev.jna:jna:5.17.0'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging { events 'failed', 'skipped' }
}

test {
    useJUnitPlatform { excludeTags 'native', 'native-packaged' }
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
    options.noTimestamp = true
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    from(['LICENSE', 'THIRD_PARTY_NOTICES.md']) { into 'META-INF' }
}

tasks.named('jar') {
    manifest.attributes('Implementation-Title': project.name, 'Implementation-Version': project.version)
}

apply from: 'gradle/native.gradle'

sourceSets {
    examples {
        java.srcDir 'examples'
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath + configurations.runtimeClasspath
    }
}
tasks.named('check') { dependsOn 'compileExamplesJava' }

apply from: 'gradle/publishing.gradle'
