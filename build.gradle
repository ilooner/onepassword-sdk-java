plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.ilooner'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    api 'com.fasterxml.jackson.core:jackson-annotations:2.19.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.19.0'
    implementation 'net.java.dev.jna:jna:5.17.0'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging { events 'failed', 'skipped' }
}

test {
    useJUnitPlatform { excludeTags 'native', 'native-packaged' }
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

tasks.named('jar') {
    from(['LICENSE', 'THIRD_PARTY_NOTICES.md']) { into 'META-INF' }
}

apply from: 'gradle/native.gradle'

sourceSets {
    examples {
        java.srcDir 'examples'
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath + configurations.runtimeClasspath
    }
}
tasks.named('check') { dependsOn 'compileExamplesJava' }

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact tasks.named('nativeJar')
            pom {
                name = '1Password SDK for Java (community)'
                description = 'Java bindings for the 1Password SDK core.'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
            }
        }
    }
}
