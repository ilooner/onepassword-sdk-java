import groovy.json.JsonSlurper
import java.security.MessageDigest

// Download immutable upstream artifacts only when explicitly requested.
def manifest = new JsonSlurper().parse(file('gradle/native-libraries.json'))
def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def platformOs = os.contains('mac') ? 'macos' : os.contains('win') ? 'windows' : 'linux'
def platformArch = arch in ['arm64', 'aarch64'] ? 'aarch64' : arch in ['amd64', 'x86_64'] ? 'x86_64' : arch
String targetPlatform = providers.gradleProperty('nativePlatform').getOrElse("${platformOs}-${platformArch}")
if (!manifest.platforms.containsKey(targetPlatform)) {
    throw new GradleException("Unsupported native platform: ${targetPlatform}")
}
def nativeDirectory = layout.buildDirectory.dir("native/${targetPlatform}")
def nativeEntry = manifest.platforms[targetPlatform]

def registerNative = { String platform, entry ->
    def suffix = platform.split(/[-_]/).collect { it.capitalize() }.join('')
    def downloadName = platform == targetPlatform ? 'downloadNative' : "downloadNative${suffix}"
    def jarName = platform == targetPlatform ? 'nativeJar' : "native${suffix}Jar"
    def directory = layout.buildDirectory.dir("native/${platform}")

    def download = tasks.register(downloadName) {
        group = 'build setup'
        description = "Downloads and verifies the pinned 1Password native core for ${platform}."
        inputs.file 'gradle/native-libraries.json'
        inputs.property 'platform', platform
        outputs.dir directory
        doLast {
            def destination = directory.get().file(entry.filename).asFile
            destination.parentFile.mkdirs()
            def temporary = new File(destination.parentFile, "${entry.filename}.part")
            try {
                def url = "https://raw.githubusercontent.com/1Password/onepassword-sdk-python/${manifest.commit}/src/onepassword/lib/${entry.architecture}/${entry.filename}"
                def connection = new URI(url).toURL().openConnection()
                connection.connectTimeout = 30_000
                connection.readTimeout = 60_000
                def digest = MessageDigest.getInstance('SHA-256')
                connection.inputStream.withCloseable { input ->
                    temporary.withOutputStream { output ->
                        byte[] buffer = new byte[65536]
                        int count
                        while ((count = input.read(buffer)) != -1) {
                            digest.update(buffer, 0, count)
                            output.write(buffer, 0, count)
                        }
                    }
                }
                if (digest.digest().encodeHex().toString() != entry.sha256) {
                    throw new GradleException("Native core SHA-256 verification failed for ${platform}")
                }
                java.nio.file.Files.move(temporary.toPath(), destination.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } finally {
                temporary.delete()
            }
        }
    }

    tasks.register(jarName, Jar) {
        group = 'build'
        description = "Packages the pinned native core for ${platform}."
        dependsOn download
        archiveClassifier = "native-${platform}"
        from(directory) { into "native/${platform}" }
    }
}

ext.nativeArtifactTasks = manifest.platforms.collectEntries { platform, entry ->
    [(platform): registerNative(platform, entry)]
}

tasks.register('allNativeJars') {
    group = 'build'
    description = 'Packages all supported native platforms with verified upstream binaries.'
    dependsOn nativeArtifactTasks.values()
}

tasks.register('nativeTest', Test) {
    group = 'verification'
    description = 'Exercises the real native ABI and offline core operations; no account required.'
    dependsOn 'downloadNative', 'testClasses'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'native' }
    doFirst {
        systemProperty 'onepassword.native.path', nativeDirectory.get().file(nativeEntry.filename).asFile.absolutePath
    }
}

tasks.register('packagedNativeTest', Test) {
    group = 'verification'
    description = 'Checks native loading from the platform JAR, including resource extraction.'
    dependsOn 'nativeJar', 'testClasses'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath + files(tasks.named('nativeJar'))
    useJUnitPlatform { includeTags 'native-packaged' }
    environment 'ONEPASSWORD_NATIVE_LIBRARY', ''
}
