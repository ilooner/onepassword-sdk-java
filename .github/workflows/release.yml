name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag, such as v1.2.3 (created on the selected branch commit if missing)
        required: true
        type: string
      publish:
        description: Create missing tag/release and publish artifacts (false builds only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and pin the commit
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=()
          if [[ "$MANUAL_RUN" == true ]]; then
            args+=(--allow-missing-tag)
          fi
          python3 .github/scripts/release.py prepare "$RELEASE_TAG" "${args[@]}" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
      release-version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, verify]
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-artifacts.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      publish: ${{ github.event_name == 'release' || inputs.publish == true }}
